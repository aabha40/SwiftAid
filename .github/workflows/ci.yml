name: SwiftAid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real MongoDB and Redis for the integration test suite — these
    # spin up as sidecar containers just for this CI run, isolated
    # from any real data. No secrets needed: the integration tests
    # never call Groq or Firebase (see app.js's zero-side-effects
    # design and requests.test.js's note on skipping AI calls).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Verify critical server files exist
        run: |
          test -f server/index.js && echo "✅ index.js"
          test -f server/config/db.js && echo "✅ db.js"
          test -f server/services/geoMatch.js && echo "✅ geoMatch.js"
          test -f server/services/hospitalScore.js && echo "✅ hospitalScore.js"
          test -f server/services/eta.js && echo "✅ eta.js"
          test -f Dockerfile && echo "✅ Dockerfile"
          test -f .env.example && echo "✅ .env.example"
          echo "✅ All critical files verified"

      - name: Check Node.js syntax on all server files
        run: |
          node --check server/index.js
          node --check server/config/db.js
          node --check server/config/redis.js
          node --check server/config/socket.js
          node --check server/services/eta.js
          node --check server/services/geoMatch.js
          node --check server/services/hospitalScore.js
          node --check server/services/notification.js
          node --check server/controllers/authController.js
          node --check server/controllers/requestController.js
          echo "✅ All files passed syntax check"

      - name: Write .env.test for CI
        run: |
          cat > .env.test << EOF
          MONGO_URI=mongodb://localhost:27017/swiftaid_test
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=ci-test-secret-do-not-use-in-production
          JWT_EXPIRES_IN=7d
          EOF

      - name: Run full test suite (unit + integration)
        run: npm test